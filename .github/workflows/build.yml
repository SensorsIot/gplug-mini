# Builds and publishes gPlug-mini firmware.
#
# Implements FSD FR-BLD-01 through -05, -07 (build half) and -08.
#
# The host-test half of FR-BLD-07 is still missing: there is no host tier yet.
# Add it to this job, or a separate ci.yml, with the first test.
name: Build Firmware

on:
  push:
    branches: [main]       # FR-BLD-07: build every push. Publishing stays
    tags: ['v*.*.*']       # tag-only — the release step below is gated on it.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (e.g. 0.1.0)'
        required: true

permissions:
  contents: write          # required to create the release

env:
  APP_NAME: gplug-mini     # must match project() in CMakeLists.txt
  IDF_TARGET: esp32c3

jobs:
  build:
    runs-on: ubuntu-latest
    # Pinned to the version the FSD names (§4.4). Never `latest`: the container
    # tag is the only statement of what built the binary.
    container: espressif/idf:v6.0.2
    defaults:
      run:
        shell: bash

    steps:
      # The container is root, the workspace belongs to the runner user, and git
      # refuses a repository owned by someone else. actions/checkout exempts
      # itself, so without this the failure surfaces later — at the first git
      # call in a `run:` step. '*' rather than the workspace, because $IDF_PATH
      # and any submodule are git repositories the build reads too.
      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          # ESP-IDF derives esp_app_desc_t's version from `git describe` when
          # PROJECT_VER is unset. The default shallow checkout has no tags, so
          # that silently degrades to a bare commit hash — FR-BLD-01 needs this.
          fetch-depth: 0

      - name: Show the IDF version actually used
        run: . $IDF_PATH/export.sh >/dev/null && idf.py --version

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # FR-BLD-02: an untagged build carries the short commit hash, so a
            # branch push can never produce a string that looks like a release.
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building $VERSION"

      # FR-BLD-01/-02: the version reaches esp_app_desc_t, so the same string
      # appears on the Home Assistant device page, in the OTA log and on the
      # release asset. FR-BLD-05: the simulated build carries a -sim suffix.
      - name: Build production firmware
        run: |
          . $IDF_PATH/export.sh >/dev/null
          idf.py -B build/prod -DPROJECT_VER="${{ steps.version.outputs.version }}" \
                 set-target $IDF_TARGET
          idf.py -B build/prod -DPROJECT_VER="${{ steps.version.outputs.version }}" build

      # FR-BLD-03: the simulated build is selected at compile time, via a second
      # sdkconfig defaults file rather than a CMake option — the seam the Harness
      # specifies is the Kconfig symbol CONFIG_GPLUG_SIM_METER.
      - name: Build simulated firmware
        run: |
          . $IDF_PATH/export.sh >/dev/null
          idf.py -B build/sim \
                 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.sim.defaults" \
                 -DPROJECT_VER="${{ steps.version.outputs.version }}-sim" \
                 set-target $IDF_TARGET
          idf.py -B build/sim \
                 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.sim.defaults" \
                 -DPROJECT_VER="${{ steps.version.outputs.version }}-sim" build

      # FR-BLD-04: the production build must contain no capability to fabricate
      # readings. Checked on the artefact rather than the source, so it survives a
      # broken guard or a defaults file that stopped being applied. Both
      # directions: a simulated build that stopped simulating makes every bench
      # run meaningless while looking fine.
      - name: Verify the production image cannot fabricate readings
        run: |
          if grep -q "GPLUG-SIM" build/prod/${APP_NAME}.bin; then
            echo "FATAL: production image contains the embedded capture"; exit 1; fi
          if ! grep -q "GPLUG-SIM" build/sim/${APP_NAME}.bin; then
            echo "FATAL: simulated image lacks the embedded capture"; exit 1; fi
          echo "variant separation verified"

      - name: Collect artefacts
        run: |
          V="${{ steps.version.outputs.version }}"
          cp build/prod/${APP_NAME}.bin firmware_v${V}.bin
          cp build/prod/${APP_NAME}.elf firmware_v${V}.elf
          cp build/sim/${APP_NAME}.bin  firmware_v${V}-sim.bin
          cp build/sim/${APP_NAME}.elf  firmware_v${V}-sim.elf
          # Cold-flash set for the first USB flash: three parts at their offsets,
          # which is what the workbench's POST /api/flash expects.
          mkdir -p coldflash
          cp build/prod/${APP_NAME}.bin                     coldflash/firmware.bin
          cp build/prod/bootloader/bootloader.bin           coldflash/bootloader.bin
          cp build/prod/partition_table/partition-table.bin coldflash/partitions.bin
          # sdkconfig is generated from sdkconfig.defaults and not committed;
          # without this the effective config of a release dies with the runner.
          cp build/prod/sdkconfig sdkconfig.generated
          ls -la firmware_v* coldflash/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-v${{ steps.version.outputs.version }}
          path: |
            firmware_v*.bin
            firmware_v*.elf
            sdkconfig.generated
            coldflash/*.bin

      # FR-BLD-08: published only from a tagged commit. The tag is also the human
      # assertion that the bench suite passed — see FSD §20.2.
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            firmware_v*.bin
            firmware_v*.elf
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
