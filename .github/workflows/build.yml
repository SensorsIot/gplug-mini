# Builds and publishes gPlug-mini firmware.
#
# Implements FSD FR-BLD-01 through -05, -07 (build half) and -08.
#
# One build per run. The variant is chosen when the run starts: pushes and tags
# build production, and the simulated firmware is built on demand, because it is
# only wanted when somebody is about to flash it to the bench. FR-BLD-04 is
# checked against whichever image this run produced, so the two directions of
# the check are covered across runs rather than within one.
#
# The host-test half of FR-BLD-07 lives in host-tests.yml — it shares no
# toolchain with this job and runs in seconds rather than minutes.
name: Build Firmware

on:
  push:
    branches: [main]       # FR-BLD-07: build every push. Publishing stays
    tags: ['v*.*.*']       # tag-only — the release step below is gated on it.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (e.g. 0.1.0)'
        required: true
      variant:
        description: 'Which firmware to build'
        type: choice
        options: [production, simulated]
        default: production

permissions:
  contents: write          # required to create the release

env:
  APP_NAME: gplug-mini     # must match project() in CMakeLists.txt
  IDF_TARGET: esp32c3
  # The one switch for variant handling. 'false' — the usual case, a project
  # with a single firmware — pins every run to production and skips the marker
  # check; the `variant` input above then does nothing. gPlug-mini needs it
  # because FR-BLD-03 requires a simulated build.
  MULTI_VARIANT: 'true'
  SIM_MARKER: GPLUG-SIM    # present only in the simulated image

jobs:
  build:
    runs-on: ubuntu-latest
    # Pinned to the version the FSD names (§4.4). Never `latest`: the container
    # tag is the only statement of what built the binary.
    container: espressif/idf:v6.0.2
    defaults:
      run:
        shell: bash

    steps:
      # The container is root, the workspace belongs to the runner user, and git
      # refuses a repository owned by someone else. actions/checkout exempts
      # itself, so without this the failure surfaces later — at the first git
      # call in a `run:` step. '*' rather than the workspace, because $IDF_PATH
      # and any submodule are git repositories the build reads too.
      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v5
        with:
          # ESP-IDF derives esp_app_desc_t's version from `git describe` when
          # PROJECT_VER is unset. The default shallow checkout has no tags, so
          # that silently degrades to a bare commit hash — FR-BLD-01 needs this.
          fetch-depth: 0

      - name: Show the IDF version actually used
        run: . $IDF_PATH/export.sh >/dev/null && idf.py --version

      - name: Decide what to build
        id: plan
        run: |
          # Only a manual run can ask for the simulated firmware. A tag is a
          # release, and a release is never simulated — FR-BLD-04, FR-BLD-08.
          VARIANT="${{ github.event.inputs.variant || 'production' }}"
          [ "$MULTI_VARIANT" = "true" ] || VARIANT=production

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # FR-BLD-02: an untagged build carries the short commit hash, so a
            # branch push can never produce a string that looks like a release.
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi

          # FR-BLD-03: the variant is a compile-time choice, made through a
          # second sdkconfig defaults file. The seam is the Kconfig symbol
          # CONFIG_GPLUG_SIM_METER; -DCONFIG_… on the command line would not
          # set it. FR-BLD-05: the simulated version string carries -sim.
          DEFAULTS="sdkconfig.defaults"
          if [ "$VARIANT" = "simulated" ]; then
            DEFAULTS="sdkconfig.defaults;sdkconfig.sim.defaults"
            VERSION="$VERSION-sim"
          fi

          {
            echo "variant=$VARIANT"
            echo "version=$VERSION"
            echo "defaults=$DEFAULTS"
          } >> $GITHUB_OUTPUT
          echo "Building the $VARIANT firmware as $VERSION"

      # -DSDKCONFIG keeps the config inside the build directory. ESP-IDF would
      # otherwise write it to the project root, where a leftover from an earlier
      # run outranks the defaults file and can silently produce the wrong
      # variant. It also puts the file where "Collect artefacts" looks for it.
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh >/dev/null
          ARGS="-B build -DSDKCONFIG=$PWD/build/sdkconfig \
                -DSDKCONFIG_DEFAULTS=${{ steps.plan.outputs.defaults }} \
                -DPROJECT_VER=${{ steps.plan.outputs.version }}"
          idf.py $ARGS set-target $IDF_TARGET
          idf.py $ARGS build

      # FR-BLD-04: a production image must contain no capability to fabricate
      # readings. Checked on the artefact rather than the source, so it survives
      # a broken guard or a defaults file that stopped being applied. Asserted
      # in both directions — a simulated image that stopped simulating makes
      # every bench run meaningless while looking perfectly healthy.
      - name: Verify the image matches the variant asked for
        if: env.MULTI_VARIANT == 'true'
        run: |
          if grep -q "$SIM_MARKER" build/${APP_NAME}.bin; then FOUND=yes; else FOUND=no; fi
          case "${{ steps.plan.outputs.variant }}:$FOUND" in
            production:no|simulated:yes)
              echo "verified: ${{ steps.plan.outputs.variant }} image, marker $FOUND" ;;
            production:yes)
              echo "FATAL: production image contains $SIM_MARKER"; exit 1 ;;
            simulated:no)
              echo "FATAL: simulated image lacks $SIM_MARKER"; exit 1 ;;
          esac

      - name: Collect artefacts
        run: |
          V="${{ steps.plan.outputs.version }}"
          cp build/${APP_NAME}.bin firmware_v${V}.bin
          cp build/${APP_NAME}.elf firmware_v${V}.elf
          # Cold-flash set for the first USB flash. flash_args travels with the
          # images because the offsets are not constant: moving the app from a
          # single factory partition to ota_0 moved it from 0x10000 to 0x20000,
          # and anything that had memorised the old number would flash into the
          # wrong partition and boot the old image. Let the build state them.
          # Take the file list FROM flash_args rather than naming images here.
          # A hand-written list silently goes stale: enabling OTA added a fourth
          # image, ota_data_initial.bin at 0xf000, and a set missing it leaves
          # the bootloader reading whatever the previous layout left there.
          # Names stay the build's own — /api/flash pairs flash_args entries to
          # uploaded parts by basename.
          mkdir -p coldflash
          cp build/flash_args coldflash/
          awk '$1 ~ /^0x/ {print $2}' build/flash_args | while read -r f; do
            cp "build/$f" coldflash/ || { echo "FATAL: flash_args names build/$f, which does not exist"; exit 1; }
          done
          echo "flash_args:"; cat coldflash/flash_args
          echo "collected:";  ls coldflash/
          # sdkconfig is generated from sdkconfig.defaults and not committed;
          # without this the effective config of a release dies with the runner.
          cp build/sdkconfig sdkconfig.generated
          ls -la firmware_v* coldflash/

      # The `other` tier: properties no execution environment can observe, so
      # they are checked against the artefact this job just produced. Runs here
      # rather than in host-tests.yml because that job never builds firmware and
      # so has nothing to inspect.
      - name: Artefact checks
        run: tools/check-artefacts.sh coldflash

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-v${{ steps.plan.outputs.version }}
          path: |
            firmware_v*.bin
            firmware_v*.elf
            sdkconfig.generated
            coldflash/*

      # FR-BLD-08: published only from a tagged commit. The tag is also the human
      # assertion that the bench suite passed — see FSD §20.2.
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            firmware_v*.bin
            firmware_v*.elf
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
