# A device that wakes mid-burst can land on a flag byte - one position in about
# 150, so not rare. Measured 2026-08-05: prepending a single 0x7E to a working
# capture takes it from 10 decoded values to 0. The parser does not skip a
# leading flag, so the firmware must, and nothing currently does.
- id: TS-023
  verifies: [FR-MTR-06]
  tier:     host
  needs:    []
  does:      Prepends one 0x7E, then two, to a complete capture
  expected:  Full decode in both cases - a leading flag is skipped, not fatal
  procedure: ctest -R TS-023
  status:    not done
  reason:    test not written; firmware does not skip leading flags yet
  commit:
  when:

