  expected: After actual supply power is restored, the device reads its stored configuration, skips Provisioning,
    rejoins the configured WiFi and MQTT broker, identifies the meter, republishes discovery and resumes fresh measurement
    publication without intervention.
  must_not:
  - Provisioning starts
  - stored configuration is lost
  - manual reset or configuration is required
  - a retained pre-power-loss message is accepted as live recovery
  - the device remains booted but non-publishing
  evidence_required:
  - power removal and restoration timestamps
  - boot and reset-reason log
  - absence of Provisioning
  - configured SSID and BSSID association
  - new MQTT session
  - meter identity and discovery messages
  - at least two fresh state publications
  status: not done
  reason: workflow definition added; implementation and execution follow later
  commit: null
  when: null
test_design_decisions:
- id: TDD-001
  status: decided
  subject: Definition of a simulated day
  needed_by:
  - WF-002
  decision:
    sequence:
      mode: 2
      cycles: 25
      cadence_s: 5
      initial_energy_wh: 20000000
      increment_per_cycle_wh: 1000
      final_energy_wh: 20024000
    expected_delta_kwh: 24.0
    publication_loss_allowed: 0
    oracle: All 25 publications arrive. The ordered published values match the generated sequence exactly after unit
      conversion, and the observed accumulated delta is 24.000 kWh. Each energy entity's discovery payload carries
      device_class energy, state_class total_increasing and unit kWh.
  rationale: Twenty-five accelerated samples represent hour 0 through hour 24. The starting counter is above the
    exact-float boundary and therefore also exercises integer precision without requiring a real 24-hour run.
    Revised 2026-08-06 - the oracle read "accepted by Home Assistant" and carried a 600 s statistics timeout, which
    made the decision depend on a consumer that FSD 22.0 puts outside the system under test. What the Energy Dashboard
    actually requires of us is the three payload keys, so those are asserted directly and the timeout is gone.
- id: TDD-002
  status: decided
  subject: Maximum duration of a valid OTA workflow
  needed_by:
  - WF-004
  - WF-005
  decision:
    download_start_timeout_s: 5
    max_command_to_reboot_s: 300
    max_reboot_to_mqtt_validation_s: 60
    max_successful_workflow_s: 360
    rollback_reset_after_bad_image_boot_s: 65
    max_rollback_boot_s: 30
    max_rollback_mqtt_recovery_s: 60
  rationale: Five minutes is ample for a local firmware download and flash write, while the 60-second post-boot
    limit follows the MQTT recovery contract. The rollback reset occurs only after the full validation window has
    elapsed.
- id: TDD-003
  status: decided
  subject: Real-meter comparison tolerance
  needed_by:
  - WF-006
  - WF-007
  decision:
    paired_observations: 3
    minimum_interval_between_pairs_s: 60
    maximum_display_to_publication_skew_s: 5
    load_condition: stable during each comparison window
    identity: exact match
    energy_tolerance: one least-significant digit of the meter display after unit conversion
    power_tolerance: maximum of one display least-significant digit, 10 W, or 2 percent of the displayed value
  rationale: Energy is cumulative and should match to the meter display resolution. Instantaneous power needs a
    small allowance for display rounding and sampling skew, while three separated pairs prevent a one-off coincidence.
- id: TDD-004
  status: decided
  subject: Production-image smoke-test observation window
  needed_by:
  - WF-010
  decision:
    fresh_broker_required: true
    meter_input: silent or physically disconnected
    observation_window_s: 30
    prohibited_fresh_topics:
    - gplug/<mac>/state
    - homeassistant/sensor/+/config
    allowed_publications:
    - availability or status
    - version and diagnostics that contain no meter values
  rationale: Thirty seconds covers several normal five-second meter publication opportunities without turning a
    smoke test into a soak test.
- id: TDD-005
  status: decided
  subject: Physical and repeatable reconfiguration test method
  needed_by:
  - WF-011
  decision:
    release_workflow_method: manual operation of the actual device button
    runtime_hold_ms: 5000
    softap_timeout_s: 5
    boot_strap_check: Hold the actual button through reset once; the device must boot normally and must not enter
      serial-download mode.
    repeatable_regression_method: A firmware test seam may inject the logical five-second event for routine regression,
      but it does not replace the physical release test.
    physical_test_frequency: first product release and after a hardware, GPIO or button-handling change
  rationale: One physical test proves the real GPIO path. A logical seam is useful for repetition but cannot prove
    wiring or boot-strap behaviour.
release_gates:
  firmware_release:
    status: proposed
    requires:
      atomic_policy:
      - every applicable Must and Should requirement has at least one atomic test
      - every release-applicable atomic test has a current successful result
      - no failed or stale release-applicable test remains
      workflows:
      - WF-001
      - WF-002
      - WF-003
      - WF-004
      - WF-005
      - WF-008
      - WF-009
      - WF-010
      - WF-011
      - WF-012
      - WF-013
  first_product_release:
    status: proposed
    inherits: firmware_release
    additionally_requires:
      workflows:
      - WF-006
      - WF-007
      field_decisions:
      - TDD-003
  subsequent_firmware_release:
    status: proposed
    inherits: firmware_release
    field_evidence_policy: WF-006 and WF-007 may be carried forward only when an impact analysis confirms that meter
      handling, hardware, power, WiFi and timing behaviour are unchanged.
