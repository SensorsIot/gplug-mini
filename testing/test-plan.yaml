    with:
      expected_ssid: replacement:wifi_ssid
      expected_bssid: replacement:wifi_bssid
      timeout_s: 60
    checkpoint_tests:
    - TS-058
    - TS-031
  - id: restore
    action: restore_bench
  expected: A running device enters Provisioning through the physical button, accepts replacement configuration,
    becomes OPERATIONAL on the replacement network and retains that configuration after reset.
  must_not:
  - the button causes serial-download mode
  - the prior configuration is lost before replacement values are accepted
  - physical disassembly or reflashing is required
  evidence_required:
  - physical button actuation timing
  - supervisor transition and SoftAP timing
  - replacement portal submission
  - replacement SSID and BSSID association
  - replacement broker session
  - fresh publication after reconfiguration
  - reconnection after reset
  status: not done
  reason: workflow definition complete; physical execution follows later
  commit: null
  when: null
- id: WF-012
  kind: workflow
  scenario: negative
  role: release-gate
  name: Recover useful operation after a watchdog reset
  validates:
  - product-goal:recover-from-hang
  children:
  - TS-081
  - TS-082
  - TS-040
  - TS-052
  - TS-110
  tier: bench
  needs:
  - board
  - wifi-ap
  - mqtt-broker
  - mbus-sim
  start_state:
    device: OPERATIONAL
    configuration: stored
    fresh_publication: confirmed
  steps:
