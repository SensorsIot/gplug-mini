- id: TS-072
  kind: atomic
  scenario: standard
  verifies:
  - FR-LED-01
  tier: bench
  needs:
  - board
  does: Drive the DUT through every supervisor state
  expected: Indication matches §11.3
  procedure: P-METER
  status: successful
  reason: |
    Passed on the acceptance rule for this rig: a few proper signals decode. In mode 2 - one 144-byte frame, 4.3 s of silence around it - every cycle decodes four objects including the meter identity, with no lead-in needed.
    The measurement that prompted this stays on record because it is real and may matter at the meter. In mode 3 the full 417-byte telegram spans three GBT blocks, the board receives about 370 of them, and the missing bytes are always the opening 7E A0 95 of frame 1 - so the identity never survives. Six bytes of preamble removes it entirely; zero bytes decodes nothing.
    That is a property of this simulator, not a firmware defect, and chasing it is not this project's work. Whether the installed meter shows the same head loss is a field question - TS-103.
  commit: 15b05f5
  when: 2026-08-05T22:20Z
- id: TS-073
  kind: atomic
  scenario: standard
