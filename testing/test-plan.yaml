    with:
      task: one watchdog-subscribed task
      stall_duration_s: 10
    checkpoint_tests:
    - TS-081
    - TS-082
  - id: observe-reset
    action: boot_device
    with:
      timeout_s: 15
    expect:
      reset_reason: task-watchdog
