- id: WF-013
  kind: workflow
  scenario: standard
  role: release-gate
  name: Resume normal operation after power restoration
  validates:
  - product-goal:normal-unattended-startup
  children:
  - TS-018
  - TS-031
  - TS-040
  - TS-045
  - TS-052
  - TS-057
  - TS-108
  - TS-109
  - TS-110
  - TS-111
  tier: bench
  needs:
  - board
  - power-cycle
  - wifi-ap
  - mqtt-broker
  - mbus-sim
  start_state:
    device: OPERATIONAL with valid configuration stored
    access_point: available
    broker: fresh and available
    meter_simulator: mode 2, continuous valid cycles
  steps:
  - id: confirm-baseline
    action: confirm_bench_ready
    with:
      required_capabilities:
      - board
      - power-cycle
      - wifi-ap
      - mqtt-broker
      - mbus-sim
  - id: start-meter-traffic
    action: feed_meter_cycles
    with:
      mode: 2
      run_until_step: prove-live-publication
      identity: '44337811'
      energy: 12345
      fault: none
  - id: remove-and-restore-power
    action: power_cycle_device
    checkpoint_tests:
    - TS-057
  - id: observe-boot
    action: boot_device
    with:
      timeout_s: 15
    expect:
      supervisor_state: CONNECTING
      provisioning_absent: true
    checkpoint_tests:
    - TS-018
    - TS-031
  - id: join-configured-network
    action: wait_for_wifi_association
    with:
