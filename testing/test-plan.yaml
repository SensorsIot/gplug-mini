# gPlug-mini — the single source of truth for testing
#
# What must be proved lives in the FSD; this file says how it will be proved,
# with what equipment, and what happened last time. Requirements are referenced
# by ID and never restated.
#
# It defines test DESIGN. A definition here is not a claim that the test is
# written, let alone that it ran: `status`, `reason`, `commit` and `when` are
# written by the runner and by nothing else.
#
# Two independent classifications, and conflating them is the mistake this
# schema exists to prevent:
#
#   kind      atomic | workflow            structural level
#   scenario  standard | deviation | negative | security    what is exercised
#
# An atomic case answers "which specified behaviour failed?". A workflow answers
# "does the product do its job?". Workflow status is NOT derived from its
# children - all children green with the workflow red is an integration defect,
# and that is a result worth being able to express.
#
# How to derive, write, validate and run all of this is
# docs/Harness/standards/testing.md.
#
metadata:
  project: gPlug-mini
  document: Hierarchical test plan
  source: testing/test-plan.yaml
  schema_version: '1.1'
  design:
    single_file: true
    test_case_kinds:
    - atomic
    - workflow
    scenarios:
    - standard
    - deviation
    - negative
    - security
    statuses:
    - not done
    - successful
    - failed
    - blocked
    - retired
    hierarchy: A workflow lists atomic test cases in children. A child may support more than one workflow. children
      express traceability and test design; the workflow executes its own continuous steps using actions.
    result_rule: Workflow status is independent of child status. All children can pass while the workflow fails
      at an integration handoff, and a workflow can pass while some atomic boundary or diagnostic tests remain incomplete.
    workflow_required_fields:
    - id
    - kind
    - scenario
    - name
    - children
    - tier
    - needs
    - start_state
    - steps
    - expected
    - must_not
    - evidence_required
    workflow_design_rules:
    - A workflow is one continuous execution; it does not run its children as isolated test sessions.
    - children provide hierarchical traceability to atomic contracts exercised at workflow checkpoints.
    - A workflow must prove an externally useful final result across at least one component boundary.
    - Every important handoff must have a checkpoint or observable result.
    - Workflow status is independent of the status of its children.
    - Unknown test limits must reference an explicit test-design decision; free-text placeholders are not executable.
    - A workflow must define required evidence even though evidence is collected only during later execution.
    coverage_policy:
      requirements: Every Must and Should requirement has at least one atomic test.
      acceptance: Every FSD acceptance scenario has a primary workflow.
      goals: Every product goal is covered by at least one release-gate workflow.
      state_machine: Every normative supervisor transition has atomic coverage; useful multi-transition paths have
        workflow coverage.
      risks: Network, broker, meter, watchdog, update and persistence recovery are represented by workflows or atomic
        tests.
  migration:
    existing_atomic_tests: 109
    added_workflows: 13
    old_kind_moved_to: scenario
    new_kind_values:
    - atomic
    - workflow
    existing_results: carried forward unchanged except TS-025 status normalized to retired
    enhancement: Added broker-outage, meter-silence, production-image, reconfiguration and watchdog-recovery workflows;
      structured capability parameters; explicit unresolved test-design decisions; workflow evidence contracts;
      and proposed release gates.
    final_design_changes:
    - Corrected all structured capability and fixture references.
    - Added WF-013 for normal unattended startup after power restoration.
    - Resolved TDD-001 through TDD-005 with concrete, shipping-focused decisions.
    - Represented the manually operated physical button separately from unavailable automated GPIO actuation.
capabilities:
  board:
    what: The gPlug-mini board in workbench slot 1, resettable and readable over serial
    available: true
  mbus-sim:
    what: MBUS-Simulator in workbench slot 3, driven over its console
    available: true
    notes: modes 1-4, plus fault / gap / silence / serial / identity / energy / scaler
    notes2: |
      The console is driven over the RFC2217 proxy on port 4003 at 115200, not through the workbench HTTP API, which can read serial but not write it. The proxy takes ONE client, so a per-test connection races its own teardown - testing/bench/conftest.py holds one for the session.
      Its `status` line reports the state it is actually in. Check it rather than assuming: it has been found on `identity none`, which makes every discovery test fail for a reason that has nothing to do with the device.
    limitation: |
      Mode 2 is the signal to test through, and it is solid. Measured 2026-08-05 over ten minutes: 74 cycles, every one 144 bytes, every one decoding all four objects - power, energy and the meter identity. The values match what the simulator reports sending (777 W, 12345 Wh, serial 44337811), which is a stronger claim than "something decoded" and the one worth making.
      It also carries the same energy register twice per cycle with different scalers, so it exercises FR-AGG-04 on hardware for free - the first occurrence is kept and the later one discarded, which until now was only tested at host tier against a fixture.
      Mode 3 is a different story and the rest of this note is about it.
      The signal is not fully stable and this is accepted, not a defect to chase.
      Measured 2026-08-05 with the ramp (mode 4, 409 bytes). The board receives either 409 byte-perfect from 0x00, or exactly 360 that are garbage from the first byte - bimodal, four of nine clean. A burst lands whole or garbles; it does not lose a prefix, and a garbled one also loses ~49 bytes.
      Mode 1 cannot answer the polarity question, and an earlier note here saying it had is withdrawn. The simulator does emit 0x55 (its own emit line reports `pattern=0x55`, 218 bytes), but a pattern has no HDLC framing by construction, and the firmware rotates its UART line settings after two bursts with no framing. So the probe walks candidates during the test and the board reports whichever setting it happened to be on - 0x55, 0x00 and 0xD5 in one run. The measurement moves under the measurer.
      What does stand: the mode 3 telegram arrives with valid DLMS structure - a readable date-time and OBIS codes in the first 32 bytes - so the line settings are right for that mode and the truncation is not a polarity error. TS-022 needs the probe pinned before it can mean anything.
      Mode 3 behaves differently and worse: across 12 cycles the sizes were 317-389 of 409 and never once whole. So the e450 telegram has never been delivered complete, and a `0 objects` result from a truncated burst is correct behaviour rather than a decode defect. TS-020 asserts this and currently fails - read it before reading any other meter result.
      So a bench assertion on decoded output must span several cycles and require one good one, never assert on a single cycle. A single-cycle test here is flaky by construction, and will be blamed on the firmware.
  mqtt-broker:
    what: mosquitto on Workbench2, reachable from the bench access point
    available: true
    notes: mqtt://192.168.0.168:1883, anonymous - the same address the bench tests use
    limitation: |
      An earlier note here said to start a broker on BOTH benches because "the board joins whichever radio is stronger and cannot say which". That advice was wrong and it cost a day on 2026-08-05. The board CAN say which - it logs the BSSID it associated with - and the real problem was that both benches answered to the SSID `gplug-bench`, so the DUT joined the other one (d8:3a:dd:7c:b1:c2, channel 11, 10.42.0.x) which ran no broker at all. Three correct broker addresses were each blamed in turn.
      The fix is one bench with a unique SSID, not two brokers. Check `wifi:connected with <ssid> ... bssid = <mac>` against the bench radio before ever suspecting an address.
      Mosquitto does NOT survive an rfc2217-portal restart - it stops silently and the address then refuses connections. POST /api/mqtt/start after any service restart.
    parameters:
      scheme: mqtt
      host: 192.168.0.168
      port: 1883
      anonymous: true
      uri: mqtt://192.168.0.168:1883
  wifi-ap:
    what: The bench access point the board joins, MAC-derived so it cannot be confused with another bench
    available: true
    notes: |
      SSID `wb-7cb1c2` (last 3 octets of the bench wlan0 MAC d8:3a:dd:7c:b1:c2), WPA2 `benchtest123`, channel 6, subnet 192.168.168.1/24 with DHCP .2-.20 - the third octet is the bench's own LAN host number, so two benches can collide on neither SSID nor subnet.
      Both values are DERIVED and move with the bench. On 2026-08-06 the DUT moved from Workbench2 (192.168.0.27, SSID wb-037e71, subnet 192.168.27.x) to this one, and copying the old constants across would have recreated exactly the collision they exist to prevent - this radio, d8:3a:dd:7c:b1:c2, is the one that silently stole the DUT on 2026-08-05.
      The bench's own wifi_controller.py hardcoded AP_IP = 192.168.4.1, the ESP32 SoftAP address; patched 2026-08-06 to derive the third octet from the bench's LAN address (backup: wifi_controller.py.bak-preflight, override: WIFI_AP_IP).
      192.168.4.0/24 is deliberately NOT used: 192.168.4.1 is the ESP32 SoftAP default and belongs to a DUT running its own captive portal.
      POST /api/wifi/ap_start takes `pass`, not `password`. An unknown key is ignored and the AP comes up OPEN while still answering ok:true - the DUT then refuses it under its authmode threshold.
    parameters:
      ssid: wb-7cb1c2
      bssid: d8:3a:dd:7c:b1:c2
      passphrase: benchtest123
      channel: 6
      subnet: 192.168.168.0/24
      gateway: 192.168.168.1
  wifi-ap-outage:
    what: Stopping and restarting that access point on demand, to test recovery
    available: true
    notes: POST /api/wifi/ap_start | ap_stop, both confirmed working 2026-08-05
    limitation: |
      An earlier limitation here said gplug-bench was a NetworkManager connection that ap_stop could not touch, so an outage test would observe nothing and prove nothing. That no longer holds: the bench AP is hostapd started by the workbench itself, and ap_stop/ap_start were exercised repeatedly during provisioning on 2026-08-05.
      These tests are therefore no longer blocked on equipment or on FR-PRV.
  # home-assistant and ha-bridge were capabilities here until 2026-08-06 and are
  # now deliberately absent. FSD 22.0 puts the verification boundary at the
  # broker: everything the device does is a message, and every message can be
  # read with a subscription. Testing through Home Assistant would prove the
  # device, the MQTT integration and the recipe registry at once, so a failure
  # could not be attributed - and because discovery is retained, every bench run
  # would leave real devices in a live instance until someone cleared each config
  # topic by hand. What that does not prove is recorded as an accepted risk in
  # FSD 4.1, not hidden.
  ota-relay:
    what: An update source the board can be pointed at from the bench
    available: true
    notes: |
      The workbench firmware store, found 2026-08-05 and needing nothing built. POST /api/firmware/upload puts an image on the Pi; GET /firmware/<project>/<file> serves it as application/octet-stream, which is the URL the board downloads from - reachable as http://192.168.168.1:8080/... from the bench network.
      POST /api/ota is NOT this. It runs espota.py against a board speaking ArduinoOTA, which is not the mechanism FR-OTA specifies.
    parameters:
      scheme: http
      host: 192.168.168.1
      port: 8080
      base_url: http://192.168.168.1:8080/firmware/
      upload_endpoint: POST /api/firmware/upload
    fixtures:
      valid_image_url: null
      image_that_cannot_reach_broker_url: null
      self_signed_certificate_url: null
      expired_certificate_url: null
      status: fixture URLs are assigned when the corresponding images and TLS endpoints are prepared
  physical-button:
    what: The actual GPIO9 device button, operated manually on the bench
    available: true
    parameters:
      method: manual
      active_level: low
      runtime_hold_ms: 5000
      softap_timeout_s: 5
    notes: The workbench cannot electrically drive this pin, but a person can operate the real button. This capability
      proves the physical button path; the unavailable button-gpio capability remains documented for future automation.
  button-gpio:
    what: Automated electrical actuation of the board's button pin from the workbench
    available: false
    notes: |
      Settled 2026-08-05 by hardware reset rather than by inference. Pin 18 held low across an EN pulse on pin 17 produced neither download mode nor a reset: uptime ran straight through 1982 ms to 20592 ms. The Pi header reaches this board at all - SLOT1 is a native USB JTAG device (303a:1001), so reset and flash go over USB and the GPIO pins drive nothing.
      An earlier note recorded "pin 18 low, no reaction", which could not tell a dead wire from a firmware that has no button handler. Only a strapping-pin test can, because the ROM samples GPIO9 with no firmware involved.
      So these tests need a firmware test seam - a console command standing in for the press - plus one physical press to prove the real pin path once.
  power-cycle:
    what: One removal and restoration of the board's supply, operated by a person
    available: true
    parameters:
      method: manual
      prompt_endpoint: POST /api/human-interaction
      reconnect_wait_s: 20
    notes: |
      The same arrangement as physical-button: the workbench cannot switch this slot's supply, but a person can unplug and replug the USB lead, and /api/human-interaction blocks the test until they confirm. That covers every case needing ONE power loss - WF-013 above all, which is an ordinary startup journey rather than a fault injection.
      On SLOT1 the supply and the console are the same lead, so a power cycle drops the serial connection. The test must wait for the device to re-enumerate and reattach before reading the boot banner; a monitor call issued too early returns nothing and reads as a board that never booted.
      Split out from power-cycle-endurance on 2026-08-06. Before that, one capability covered both a single operator-driven cycle and 100 automated ones, so WF-013 was recorded blocked by hardware nobody needs for it.
  power-cycle-endurance:
    what: Automated switched supply, for repeated unclean power loss under program control
    available: false
    notes: |
      Found missing 2026-08-05 while writing TS-079, which asks for 100 cycles. Nobody operates a lead a hundred times, so the manual power-cycle capability cannot stand in - and neither can a reset: FR-NVS-03 is about a write interrupted with the supply going away, and a JTAG or software reset leaves the flash controller to finish. Substituting either would make the test pass while proving nothing about the requirement.
      The EN pin route is closed too - the Pi header reaches nothing on this board (see button-gpio). This needs switched VBUS on the slot: a uhubctl-capable powered hub, or a relay in the slot's supply path.
      The same part answers a second problem. The board currently draws from a Pi USB port whose rail collapses when the radio starts - measured 2026-08-06, 3-7 brownout resets a minute at 20 dBm, which is why the firmware ships at 15 dBm as a mitigation rather than a fix. A powered hub with per-port switching supplies a rail that holds AND gives this capability.
  second-board:
    what: A second gPlug-mini board, to prove entity identity follows the meter and not the device
    available: false
    notes: slots 2 and 4 are empty; FR-ID-03 is the only test that needs one
  real-meter:
    what: The installed Landis+Gyr E450, in the cabin
    available: false
    parameters:
      model: Landis+Gyr E450
      deployment_wifi_ssid: null
      deployment_wifi_bssid: null
      comparison_tolerance: decision:TDD-003
actions:
  confirm_bench_ready:
    purpose: Verify the bench before drawing conclusions about the DUT.
    needs:
    - board
    inputs:
    - required_capabilities
    confirms:
    - every required capability is available
    - the DUT is connected to the intended bench
    - serial input has been drained
    - the starting state is known
  erase_nvs:
    purpose: Remove stored configuration and confirm the next boot is factory-new.
    needs:
    - board
    confirms:
    - NVS erase completed
    - stored WiFi and broker configuration is absent
  reset_device:
    purpose: Reset the DUT without claiming that power was removed.
    needs:
    - board
    confirms:
    - reset was issued
    - reset reason was captured
    - boot completion marker was observed
  power_cycle_device:
    purpose: Remove and restore DUT supply power.
    needs:
    - board
    - power-cycle
    inputs:
    - operator_prompt
    - reconnect_wait_s
    observes:
    - the operator's confirmation
    - the serial port disappearing and re-enumerating
    - the reset reason after the supply returns
    confirms:
    - supply was removed
    - supply was restored
    - the console was reattached before any output was read
    - the following boot reason was captured
  boot_device:
    purpose: Boot the DUT and determine its externally observable starting state.
    needs:
    - board
    inputs:
    - timeout_s
    observes:
    - reset reason
    - firmware version
    - supervisor state
    - serial completion marker
  wait_for_supervisor_state:
    purpose: Wait for a named supervisor state using positive evidence.
    needs:
    - board
    inputs:
    - expected_state
    - timeout_s
    confirms:
    - the expected state was positively observed before timeout
  wait_for_device_softap:
    purpose: Observe and identify the DUT provisioning access point.
    needs:
    - board
    inputs:
    - timeout_s
    observes:
    - SSID
    - BSSID
    - security mode
    - time until association is accepted
  connect_to_device_softap:
    purpose: Associate a client with the DUT SoftAP.
    needs:
    - board
    inputs:
    - passphrase
    - expected_result
    confirms:
    - association outcome matches the expectation
    - the joined BSSID belongs to the DUT
  request_configuration_page:
    purpose: Request the captive portal through the DUT SoftAP.
    needs:
    - board
    inputs:
    - hostname
    confirms:
    - DNS redirects to the DUT
    - the configuration page is returned
  submit_configuration:
    purpose: Submit WiFi, MQTT and optional DLMS configuration through the portal.
    needs:
    - board
    inputs:
    - wifi_ssid
    - wifi_passphrase
    - broker_host
    - broker_port
    - mqtt_username
    - mqtt_password
    - dlms_key
    confirms:
    - the portal accepts or rejects the input as specified
    - accepted values are persisted before Provisioning ends
  start_access_point:
    purpose: Start the intended workbench access point and verify its identity.
    needs:
    - wifi-ap
    confirms:
    - SSID matches the capability definition
    - BSSID matches the capability definition
    - WPA2 is enabled
    - DHCP and routing are available
  stop_access_point:
    purpose: Remove the workbench access point for a controlled outage.
    needs:
    - wifi-ap
    - wifi-ap-outage
    confirms:
    - the intended BSSID is no longer available
  wait_for_wifi_association:
    purpose: Confirm association with the intended access point, not merely an SSID match.
    needs:
    - board
    - wifi-ap
    inputs:
    - expected_ssid
    - expected_bssid
    - timeout_s
    observes:
    - associated SSID
    - associated BSSID
    - assigned IP address
    - association timestamp
    confirms:
    - SSID matches
    - BSSID matches
    - an IP address is assigned
  start_broker:
    purpose: Start the bench MQTT broker and prove it accepts traffic.
    needs:
    - mqtt-broker
    confirms:
    - publish/subscribe self-test succeeds
  stop_broker:
    purpose: Make the bench MQTT broker unavailable.
    needs:
    - mqtt-broker
    inputs:
    - failure_mode
    confirms:
    - the requested DROP, REJECT or stopped-service condition exists
  wait_for_mqtt_session:
    purpose: Observe a live MQTT session established by the DUT.
    needs:
    - board
    - mqtt-broker
    inputs:
    - timeout_s
    observes:
    - client identifier
    - connection timestamp
    - birth or status message
  feed_meter_cycles:
    purpose: Drive one or more controlled meter transmission cycles.
    needs:
    - board
    - mbus-sim
    inputs:
    - mode
    - cycles
    - identity
    - energy
    - scaler
    - fault
    - gap_ms
    confirms:
    - the simulator state matches the requested inputs
    - the requested number of cycles was emitted
  observe_fresh_publication:
    purpose: Prove that a new measurement was published after the stimulus.
    needs:
    - board
    - mqtt-broker
    inputs:
    - topic
    - minimum_messages
    - timeout_s
    confirms:
    - at least one message is newer than the observation start
    - retained pre-stimulus data is not accepted as recovery evidence
  read_discovery_messages:
    purpose: Read and validate retained Home Assistant discovery messages.
    needs:
    - mqtt-broker
    inputs:
    - discovery_prefix
    observes:
    - topics
    - payloads
    - retain flags
    - unique IDs
    - device classes
    - state classes
  observe_discovery_contract:
    purpose: Check the discovery payloads carry what a consumer needs, at the broker.
    needs:
    - mqtt-broker
    inputs:
    - expected_entities
    - timeout_s
    observes:
    - one retained config topic per expected entity
    - device_class and state_class per entity
    - unit_of_measurement
    - unique_id
    - the device block, including sw_version
    - state_topic, and whether it resolves to a topic being published
    confirms:
    - every expected entity has a retained configuration
    - no configuration exists for an entity absent from the cycle
  publish_ota_command:
    purpose: Publish an OTA URL to the DUT command topic.
    needs:
    - board
    - mqtt-broker
    - ota-relay
    inputs:
    - image_url
    confirms:
    - the command was published
    - the DUT acknowledged or began processing within the specified window
  inspect_ota_state:
    purpose: Observe OTA slot, running image, validation state and reset reason.
    needs:
    - board
    observes:
    - running firmware version
    - active slot
    - pending validation state
    - rollback state
    - reset reason
  compare_with_real_meter:
    purpose: Compare published measurements with the installed meter display.
    needs:
    - board
    - real-meter
    inputs:
    - tolerance
    observes:
    - meter display values
    - decoded values
    - published values
    - meter identity
  observe_for_duration:
    purpose: Observe continuous operation for a defined period.
    needs:
    - board
    inputs:
    - duration_s
    - required_observations
    - prohibited_observations
    confirms:
    - the complete observation window elapsed
    - positive completion evidence was recorded
  restore_bench:
    purpose: Return every modified bench element to its declared baseline.
    needs:
    - board
    confirms:
    - simulator fault is none
    - simulator mode and identity are restored
    - access point is available when required
    - broker is available when required
    - DUT recovery is confirmed
  flash_firmware_variant:
    purpose: Flash a named production or simulated firmware variant and identify exactly what is running.
    needs:
    - board
    inputs:
    - variant
    - firmware_artifact
    - expected_version
    observes:
    - flashed artifact identity
    - reported firmware version
    - build variant marker
    - boot completion
    confirms:
    - the requested artifact was flashed
    - the running version and variant match the requested artifact
  observe_no_publication:
    purpose: Prove that no prohibited MQTT publication occurs during a complete observation window.
    needs:
    - mqtt-broker
    inputs:
    - topics
    - duration_s
    - allow_retained_initial_message
    confirms:
    - subscription began before the observation window
    - the complete window elapsed
    - no prohibited fresh message arrived
  silence_meter:
    purpose: Stop simulator meter traffic for a defined period and positively confirm silence.
    needs:
    - mbus-sim
    inputs:
    - duration_s
    confirms:
    - the simulator entered silence mode
    - no simulator telegram was emitted during the complete interval
  hold_device_button:
    purpose: Hold the physical device button for a specified duration.
    needs:
    - board
    - physical-button
    inputs:
    - duration_ms
    - method
    observes:
    - physical input state
    - supervisor transition
    - SoftAP appearance
    confirms:
    - the actual physical button was operated
    - the hold duration was achieved
    - the resulting supervisor behaviour was observed
  stall_watchdog_task:
    purpose: Stall a watchdog-subscribed task through the defined test seam.
    needs:
    - board
    inputs:
    - task
    - stall_duration_s
    observes:
    - stall start marker
    - watchdog reset reason
    - time to reset
test_cases:
- id: TS-001
  kind: atomic
  scenario: standard
  verifies:
  - FR-MTR-05
  tier: host
  needs: []
  does: Decodes a reference capture whose meter serial is 16 characters
  expected: Serial read whole, at the length the fixture carries
  procedure: ctest -R TS-001
  status: successful
  reason: null
  commit: 8490f3e
  when: 2026-08-05T08:58Z
- id: TS-002
  kind: atomic
  scenario: deviation
  verifies:
  - FR-MTR-05
  tier: host
  needs: []
  does: Decodes a reference capture whose meter serial is 8 characters
  expected: Serial read whole, without a rebuild between the two forms
  procedure: ctest -R TS-002
  status: successful
  reason: null
  commit: 8490f3e
  when: 2026-08-05T08:58Z
- id: TS-007
  kind: atomic
  scenario: standard
  verifies:
  - FR-MTR-09
  - FR-DEC-04
  - FR-HA-05
  tier: host
  needs: []
  does: Maps every register of a published capture to its label and unit
  expected: Right label, unit and scale for each; no value on a wrong label
  procedure: ctest -R TS-007
  status: successful
  reason: null
  commit: 8490f3e
  when: 2026-08-05T08:58Z
- id: TS-009
  kind: atomic
  scenario: deviation
  verifies:
  - FR-MTR-06
  tier: host
  needs: []
  does: Feeds a capture starting 17 bytes in, inside the first frame
  expected: The remaining frames still decode — alignment recovered
  procedure: ctest -R TS-009
  status: successful
  reason: null
  commit: 8490f3e
  when: 2026-08-05T12:41Z
- id: TS-010
  kind: atomic
  scenario: deviation
  verifies:
  - FR-MTR-06
  tier: host
  needs: []
  does: Starts 200 bytes in, losing the opening frames entirely
  expected: The remaining frames still decode — alignment recovered
  procedure: ctest -R TS-010
  status: successful
  reason: null
  commit: 8490f3e
  when: 2026-08-05T12:41Z
- id: TS-107
  kind: atomic
  scenario: standard
  verifies:
  - FR-AGG-02
  - FR-MTR-10
  tier: host
  needs: []
  does: Parses a capture repeatedly from where the previous pass stopped, until it yields nothing
  expected: The loop terminates, and the identity is among the values - one pass alone leaves it unread
  procedure: ctest -R TS-107
  status: successful
  reason: null
  commit: 2d27604
  when: 2026-08-05T21:40Z
- id: TS-011
  kind: atomic
  scenario: negative
  verifies:
  - FR-MTR-07
  tier: host
  needs: []
  does: Feeds a capture with one corrupted checksum byte
