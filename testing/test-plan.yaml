      mode: 2
      cycles: 3
      identity: '44337811'
      energy: 12347
      fault: none
  - id: prove-useful-recovery
    action: observe_fresh_publication
    with:
      topic: gplug/<mac>/state
      minimum_messages: 1
      timeout_s: 20
    checkpoint_tests:
    - TS-052
    - TS-110
  - id: restore
    action: restore_bench
  expected: The watchdog resets the stalled device within the configured period. Stored configuration survives,
    WiFi and MQTT recover automatically, and fresh meter publication resumes.
  must_not:
  - the reset reason is ambiguous or unavailable
  - manual reset or reconfiguration is required
  - the DUT returns only to a booted but non-publishing state
  evidence_required:
  - pre-stall fresh publication
  - stall start timestamp
  - watchdog reset timestamp and reason
  - post-reset stored-configuration observation
  - WiFi and MQTT recovery timestamps
