# gPlug-mini — the single source of truth for testing
#
# What must be proved lives in the FSD; this file says how it will be proved,
# with what equipment, and what happened last time. Requirements are referenced
# by ID and never restated — docs/Functionality/gPlug-mini-FSD.md is the
# authority on what the device must do.
#
# `tier` is a field, not part of the id. A test can move tier — a check that
# needs a firmware seam may only be possible on the device — and ids are stable,
# so encoding a mutable fact in an immutable name would force a choice between
# renaming a stable id and keeping one that lies. The id's prefix stays as a
# convention; the generator warns when prefix and tier disagree.
#
# `expected` is what this particular test observes, not a copy of the
# requirement's expected observation. One requirement usually needs several
# tests — positive, boundary, negative — each seeing a different part of it.
#
# The last four fields of every test are written by the runner and never by
# hand. A status carrying a commit that is not HEAD is stale: it says what
# happened then, not what happens now.
#
#   status:  not done | successful | failed
#   reason:  why, when the status is `not done`
#   commit:  what it ran against
#   when:    when it ran
#
# Procedures (P-*) are in docs/Harness/standards/testing.md.

# ─────────────────────────────────────────────────────────────────────────
# Capabilities
#
# What the environment must provide for a test to run at all. A test needing
# one that is unavailable is `not done` for that reason — computed, not typed,
# so an absent rig can never be mistaken for a passing one.
#
# This lists what THIS project's tests need. The workbench can do more (BLE,
# SDR, signal generation); none of it is used here, so none of it is listed.
# ─────────────────────────────────────────────────────────────────────────

capabilities:

  board:
    what:      The gPlug-mini board in workbench slot 1, resettable and readable over serial
    available: yes

  mbus-sim:
    what:      MBUS-Simulator in workbench slot 3, driven over its console
    available: yes
    notes:     modes 1-4, plus fault / gap / silence / serial / identity / energy / scaler
    notes2: >
      The console is driven over the RFC2217 proxy on port 4003 at 115200, not
      through the workbench HTTP API, which can read serial but not write it.
      The proxy takes ONE client, so a per-test connection races its own
      teardown - testing/bench/conftest.py holds one for the session.

      Its `status` line reports the state it is actually in. Check it rather than
      assuming: it has been found on `identity none`, which makes every discovery
      test fail for a reason that has nothing to do with the device.
    limitation: >
      The signal is not fully stable and this is accepted, not a defect to chase.

      Measured 2026-08-05 with the ramp (mode 4, 409 bytes). The board receives
      either 409 byte-perfect from 0x00, or exactly 360 that are garbage from the
      first byte - bimodal, four of nine clean. A burst lands whole or garbles;
      it does not lose a prefix, and a garbled one also loses ~49 bytes.

      Mode 1 cannot answer the polarity question, and an earlier note here saying
      it had is withdrawn. The simulator does emit 0x55 (its own emit line reports
      `pattern=0x55`, 218 bytes), but a pattern has no HDLC framing by
      construction, and the firmware rotates its UART line settings after two
      bursts with no framing. So the probe walks candidates during the test and
      the board reports whichever setting it happened to be on - 0x55, 0x00 and
      0xD5 in one run. The measurement moves under the measurer.

      What does stand: the mode 3 telegram arrives with valid DLMS structure - a
      readable date-time and OBIS codes in the first 32 bytes - so the line
      settings are right for that mode and the truncation is not a polarity
      error. TS-022 needs the probe pinned before it can mean anything.

      Mode 3 behaves differently and worse: across 12 cycles the sizes were
      317-389 of 409 and never once whole. So the e450 telegram has never been
      delivered complete, and a `0 objects` result from a truncated burst is
      correct behaviour rather than a decode defect. TS-020 asserts this and
      currently fails - read it before reading any other meter result.

      So a bench assertion on decoded output must span several cycles and require
      one good one, never assert on a single cycle. A single-cycle test here is
      flaky by construction, and will be blamed on the firmware.

  mqtt-broker:
    what:      mosquitto on the workbench, reachable from the bench access point
    available: yes
    notes:     start on BOTH benches — the board joins whichever radio is stronger and cannot say which

  wifi-ap:
    what:      The gplug-bench access point the board joins
    available: yes

  wifi-ap-outage:
    what:      Stopping and restarting that access point on demand, to test recovery
    available: yes
    notes:     POST /api/wifi/ap_start | ap_stop, confirmed answering 2026-08-05
    limitation: >
      Only the workbench's OWN access point can be stopped. gplug-bench is a
      NetworkManager connection owning wlan0 and ap_stop does not touch it, so
      a board joined to gplug-bench sees no outage however often it is called -
      the test passes by observing nothing and proves nothing.

      So an outage test must first put the board on the workbench AP. Until
      provisioning exists that means a Kconfig rebuild, which is why these three
      tests wait on FR-PRV rather than on equipment.

  home-assistant:
    what:      Home Assistant at 192.168.0.202:8123
    available: yes

  ha-bridge:
    what:      The bench broker bridged to Home Assistant's broker, so published data reaches it
    available: no
    notes:     the board publishes to 10.42.0.1 on the isolated bench network; HA is on the LAN

  ota-relay:
    what:      An update source the board can be pointed at from the bench
    available: yes
    notes: >
      The workbench firmware store, found 2026-08-05 and needing nothing built.
      POST /api/firmware/upload puts an image on the Pi; GET /firmware/<project>/<file>
      serves it as application/octet-stream, which is the URL the board downloads
      from - reachable as http://10.42.0.1:8080/... from the bench network.

      POST /api/ota is NOT this. It runs espota.py against a board speaking
      ArduinoOTA, which is not the mechanism FR-OTA specifies.

  button-gpio:
    what:      The board's button pin driven from a workbench output
    available: no
    notes: >
      Settled 2026-08-05 by hardware reset rather than by inference. Pin 18 held
      low across an EN pulse on pin 17 produced neither download mode nor a reset:
      uptime ran straight through 1982 ms to 20592 ms. The Pi header reaches this
      board at all - SLOT1 is a native USB JTAG device (303a:1001), so reset and
      flash go over USB and the GPIO pins drive nothing.

      An earlier note recorded "pin 18 low, no reaction", which could not tell a
      dead wire from a firmware that has no button handler. Only a strapping-pin
      test can, because the ROM samples GPIO9 with no firmware involved.

      So these tests need a firmware test seam - a console command standing in for
      the press - plus one physical press to prove the real pin path once.

  power-cycle:
    what:      Removing and restoring the board's supply, to produce an unclean power loss
    available: no
    notes: >
      Found missing 2026-08-05 while writing TS-079, which asks for 100 of them.
      A reset is not a power loss and cannot stand in for one: FR-NVS-03 is about
      a write interrupted with the supply going away, and a JTAG or software
      reset leaves the flash controller to finish. Substituting one would make
      the test pass while proving nothing about the requirement.

      The EN pin route is closed too - the Pi header reaches nothing on this
      board (see button-gpio). This needs switched power on the slot.

  second-board:
    what:      A second gPlug-mini board, to prove entity identity follows the meter and not the device
    available: no
    notes:     slots 2 and 4 are empty; FR-ID-03 is the only test that needs one

  real-meter:
    what:      The installed Landis+Gyr E450, in the cabin
    available: no

