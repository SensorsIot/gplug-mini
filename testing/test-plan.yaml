- id: WF-001
  kind: workflow
  scenario: standard
  role: release-gate
  name: Commission a factory-new device
  validates:
  - AC-1
  children:
  - TS-030
  - TS-053
  - TS-054
  - TS-055
  - TS-059
  - TS-060
  - TS-057
  - TS-031
  - TS-045
  - TS-108
  - TS-109
  - TS-110
  - TS-111
  - TS-071
  tier: bench
  needs:
  - board
  - wifi-ap
  - mqtt-broker
  - mbus-sim
  start_state:
    device_power: 'off'
    nvs: erased
    access_point: available
    broker: available
    meter_simulator: silent
  steps:
  - id: prepare
    action: confirm_bench_ready
    with:
      required_capabilities:
      - board
      - wifi-ap
      - mqtt-broker
      - mbus-sim
  - id: factory-reset
    action: erase_nvs
    checkpoint_tests:
    - TS-030
  - id: boot
    action: boot_device
    with:
      timeout_s: 15
    expect:
      supervisor_state: PROVISIONING
    checkpoint_tests:
    - TS-030
  - id: find-softap
    action: wait_for_device_softap
    with:
      timeout_s: 10
    checkpoint_tests:
    - TS-053
    - TS-054
    - TS-060
  - id: join-softap
    action: connect_to_device_softap
    with:
      passphrase: derived-from-device-mac
      expected_result: associated
    checkpoint_tests:
    - TS-053
    - TS-054
  - id: open-portal
    action: request_configuration_page
    with:
      hostname: example.com
    checkpoint_tests:
    - TS-055
    - TS-059
  - id: configure
    action: submit_configuration
    with:
      wifi_ssid: capability:wifi-ap.parameters.ssid
      wifi_passphrase: capability:wifi-ap.parameters.passphrase
      broker_host: capability:mqtt-broker.parameters.host
      broker_port: 1883
      mqtt_username: ''
      mqtt_password: ''
      dlms_key: ''
    checkpoint_tests:
    - TS-057
  - id: join-configured-ap
    action: wait_for_wifi_association
    with:
      expected_ssid: capability:wifi-ap.parameters.ssid
      expected_bssid: capability:wifi-ap.parameters.bssid
      timeout_s: 60
    checkpoint_tests:
    - TS-031
  - id: connect-mqtt
    action: wait_for_mqtt_session
    with:
      timeout_s: 60
  - id: provide-meter-data
    action: feed_meter_cycles
    with:
      mode: 2
      cycles: 3
      identity: '44337811'
      energy: 12345
      fault: none
    checkpoint_tests:
    - TS-108
    - TS-109
  - id: observe-live-state
    action: observe_fresh_publication
    with:
      topic: gplug/<mac>/state
      minimum_messages: 1
      timeout_s: 20
    checkpoint_tests:
    - TS-110
  - id: observe-discovery
    action: read_discovery_messages
    with:
      discovery_prefix: homeassistant
    checkpoint_tests:
    - TS-045
    - TS-111
  - id: check-discovery-contract
    action: observe_discovery_contract
    with:
      expected_entities: Appendix B entities present in the cycle
      timeout_s: 60
    checkpoint_tests:
    - TS-071
